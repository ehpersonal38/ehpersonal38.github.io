<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a2233">
<title>Earshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
/*
  Earshot — a tiny shared room. Two people, two mics, voices that live in space.
  Single file: three.js for the room, PeerJS (WebRTC) for the p2p link + voice,
  Web Audio HRTF panning + a distance fade so walking apart makes them go quiet.
*/
:root{--plum:#2a2233;--ink:#fff4ea;--coral:#ff7a59;--mint:#4fd1b5;--lamp:#ffcf8a;--glass:rgba(30,22,38,.62)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--plum);color:var(--ink);
  font:16px/1.45 Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,input{font:inherit;color:inherit}
.pill{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:999px}

/* lobby */
#lobby{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:10;
  background:radial-gradient(120% 90% at 50% 10%,#4a3550 0%,#2a2233 55%,#1b1622 100%)}
#lobby .card{width:min(420px,100%);text-align:center}
#lobby h1{font:600 clamp(44px,12vw,64px)/1 Fredoka,sans-serif;margin:0 0 6px;letter-spacing:.5px}
#lobby h1 span{color:var(--lamp)}
#lobby p{margin:0 auto 22px;max-width:34ch;opacity:.82}
.blobs{display:flex;justify-content:center;gap:18px;margin:0 0 22px}
.blob{width:46px;height:62px;border-radius:23px;position:relative;box-shadow:inset -6px -8px 0 rgba(0,0,0,.18)}
.blob::before,.blob::after{content:"";position:absolute;top:18px;width:7px;height:9px;border-radius:50%;background:#1b1622}
.blob::before{left:13px}.blob::after{right:13px}
.blob.a{background:var(--coral);animation:bob 2.4s ease-in-out infinite}
.blob.b{background:var(--mint);animation:bob 2.4s ease-in-out .6s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.row{display:flex;gap:10px}
#code{flex:1;min-width:0;height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);
  text-align:center;font:600 24px Fredoka,sans-serif;letter-spacing:6px;text-transform:uppercase;outline:none}
#code:focus{border-color:var(--lamp)}
#go{height:54px;padding:0 22px;border:0;border-radius:16px;background:var(--lamp);color:#2a2233;font-weight:700;cursor:pointer}
#go:disabled{opacity:.6}
.fine{font-size:13px;opacity:.65;margin-top:16px}

/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#status{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));
  padding:8px 14px 8px 12px;display:flex;align-items:center;gap:9px;font-size:14px;max-width:calc(100vw - 150px)}
#dot{width:9px;height:9px;border-radius:50%;background:#888;flex:none}
#dot.on{background:var(--mint);box-shadow:0 0 10px var(--mint)}
#dot.wait{background:var(--lamp);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#stxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#near{position:absolute;left:max(12px,env(safe-area-inset-left));top:calc(max(12px,env(safe-area-inset-top)) + 46px);
  padding:7px 12px;font-size:13px;display:none;align-items:center;gap:9px}
#vol{width:70px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
#vol i{display:block;height:100%;width:0;background:var(--mint);transition:width .15s}
.btns{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.btns button{width:46px;height:46px;display:grid;place-items:center;cursor:pointer;position:relative}
.btns svg{width:22px;height:22px}
#mic .ring{position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--coral);opacity:0;transition:opacity .08s}
#mic.off{background:rgba(160,40,40,.7)}
#help{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  padding:7px 14px;font-size:13px;opacity:.85;white-space:nowrap;transition:opacity 1s}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);padding:8px 14px;font-size:14px;opacity:0;transition:opacity .3s}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.15);display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,244,234,.55)}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="lobby">
  <div class="card">
    <div class="blobs"><div class="blob a"></div><div class="blob b"></div></div>
    <h1>Ear<span>shot</span></h1>
    <p>A little room for two. Walk close to hear each other, walk away and the voice fades out.</p>
    <div class="row">
      <input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code">
      <button id="go">Enter</button>
    </div>
    <div class="fine">Both of you type the same code, or one of you sends the link.<br>Headphones make the left/right direction work and stop echo.</div>
  </div>
</div>

<div id="hud">
  <div id="status" class="pill"><span id="dot"></span><span id="stxt">Starting…</span></div>
  <div id="near" class="pill"><span id="dist">–</span><span id="vol"><i></i></span></div>
  <div class="btns">
    <button id="mic" class="pill" aria-label="Mute microphone"><span class="ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path id="slash" d="M4 4l16 16" style="display:none"/></svg></button>
    <button id="link" class="pill" aria-label="Copy invite link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
  </div>
  <div id="toast" class="pill"></div>
  <div id="help" class="pill">WASD / arrows to walk · drag to look</div>
  <div id="stick"><div id="knob"></div></div>
</div>

<script type="module">
import * as THREE from 'three';

/* ================= CONFIG =================
   Phone networks (mobile data / CGNAT) often can't connect directly.
   A free Metered "Open Relay" TURN account fixes that (20 GB/month free):
   sign up at metered.ca, make an app, then paste the app name + API key here. */
const CONFIG = {
  meteredApp: '',        // e.g. 'albert' if your dashboard says albert.metered.live
  meteredApiKey: '',     // the TURN credentials API key from the dashboard
  extraIceServers: [],   // or paste your own {urls, username, credential} objects
  fullVolumeWithin: 1.5, // metres: full volume inside this
  hearingRange: 15,      // metres: silent beyond this
  peerServer: null,      // null = free PeerJS cloud; or {host, port, path, secure} for your own
};
const PREFIX = 'earshot-v1-';

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const codeIn = $('code'), goBtn = $('go');
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const fromHash = location.hash.replace('#', '').toUpperCase().replace(/[^A-Z0-9]/g, '');
codeIn.value = fromHash || Array.from({length: 4}, () => ALPH[Math.random() * ALPH.length | 0]).join('');
codeIn.addEventListener('input', () => codeIn.value = codeIn.value.toUpperCase().replace(/[^A-Z0-9]/g, ''));
codeIn.addEventListener('keydown', e => { if (e.key === 'Enter') goBtn.click(); });

function setStatus(text, state) {
  $('stxt').textContent = text;
  $('dot').className = state || '';
}
let toastT;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2200);
}

/* ================= AUDIO ================= */
let actx, master, localStream, localAnalyser, micMuted = false, micDenied = false;
const remote = {stream: null, el: null, src: null, panner: null, filter: null, gain: null, analyser: null};
const buf = new Uint8Array(512);

function level(an) {
  if (!an) return 0;
  an.getByteTimeDomainData(buf);
  let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; }
  return Math.min(1, Math.sqrt(s / buf.length) * 6);
}
function sink(node) { const z = actx.createGain(); z.gain.value = 0; node.connect(z).connect(actx.destination); }

function setupLocalMeter() {
  const src = actx.createMediaStreamSource(localStream);
  localAnalyser = actx.createAnalyser(); localAnalyser.fftSize = 512;
  src.connect(localAnalyser); sink(localAnalyser);
}

function setupRemoteAudio(stream) {
  if (remote.stream === stream) return;
  teardownRemoteAudio();
  remote.stream = stream;
  // Chrome only feeds remote WebRTC audio into Web Audio if a media element is also playing it.
  remote.el = new Audio(); remote.el.srcObject = stream; remote.el.muted = true; remote.el.play().catch(() => {});
  remote.src = actx.createMediaStreamSource(stream);
  remote.panner = actx.createPanner();
  Object.assign(remote.panner, {panningModel: 'HRTF', distanceModel: 'linear', rolloffFactor: 0, refDistance: 1, maxDistance: 10000});
  remote.filter = actx.createBiquadFilter(); remote.filter.type = 'lowpass'; remote.filter.frequency.value = 18000;
  remote.gain = actx.createGain(); remote.gain.gain.value = 0;
  remote.analyser = actx.createAnalyser(); remote.analyser.fftSize = 512;
  remote.src.connect(remote.analyser); sink(remote.analyser);
  remote.src.connect(remote.panner).connect(remote.filter).connect(remote.gain).connect(master);
}
function teardownRemoteAudio() {
  for (const k of ['src', 'panner', 'filter', 'gain', 'analyser']) { try { remote[k] && remote[k].disconnect(); } catch (e) {} remote[k] = null; }
  if (remote.el) { remote.el.srcObject = null; remote.el = null; }
  remote.stream = null;
}
function setParam(p, v) { p.setTargetAtTime(v, actx.currentTime, 0.06); }
function setPos(node, x, y, z) {
  if (node.positionX) { setParam(node.positionX, x); setParam(node.positionY, y); setParam(node.positionZ, z); }
  else node.setPosition(x, y, z);
}
function updateAudio(me, them, yaw) {
  if (!actx) return;
  const L = actx.listener, fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  setPos(L, me.x, 1.5, me.z);
  if (L.forwardX) { setParam(L.forwardX, fx); setParam(L.forwardY, 0); setParam(L.forwardZ, fz); L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0; }
  else L.setOrientation(fx, 0, fz, 0, 1, 0);
  if (!remote.panner) return 0;
  setPos(remote.panner, them.x, 1.5, them.z);
  const d = Math.hypot(them.x - me.x, them.z - me.z);
  const t = Math.min(1, Math.max(0, (d - CONFIG.fullVolumeWithin) / (CONFIG.hearingRange - CONFIG.fullVolumeWithin)));
  const g = (1 - t) * (1 - t);
  setParam(remote.gain.gain, g * 1.6);
  setParam(remote.filter.frequency, 18000 * Math.pow(2500 / 18000, t)); // gets muffled as it fades
  return g;
}

/* ================= NETWORK ================= */
let peer, dc, mc, role, roomCode, iceServers, guestTimer;

async function getIceServers() {
  const list = [{urls: 'stun:stun.l.google.com:19302'}, {urls: 'stun:stun.relay.metered.ca:80'}, ...CONFIG.extraIceServers];
  if (CONFIG.meteredApp && CONFIG.meteredApiKey) {
    try {
      const r = await fetch(`https://${CONFIG.meteredApp}.metered.live/api/v1/turn/credentials?apiKey=${encodeURIComponent(CONFIG.meteredApiKey)}`);
      if (r.ok) list.push(...await r.json());
    } catch (e) { console.warn('TURN fetch failed', e); }
  }
  return list;
}

function connect() {
  if (peer && !peer.destroyed) peer.destroy();
  const hostId = PREFIX + roomCode;
  const opts = {config: {iceServers}, debug: 1, ...(CONFIG.peerServer || {})};
  role = 'host';
  peer = new Peer(hostId, opts);
  peer.on('open', () => setStatus(`Room ${roomCode} · waiting for them`, 'wait'));
  peer.on('connection', c => {
    if (dc && dc.open) { c.on('open', () => { c.send({t: 'full'}); setTimeout(() => c.close(), 400); }); return; }
    attachData(c);
  });
  peer.on('call', call => { if (mc) mc.close(); mc = call; call.answer(localStream); attachCall(call); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); joinAsGuest(hostId, opts); }
    else netError(err);
  });
  peer.on('disconnected', () => softReconnect(peer));
}

// the matchmaking socket dropped: the p2p link itself keeps working, just get back on the server slowly
function softReconnect(p) {
  setTimeout(() => { if (p === peer && !p.destroyed && p.disconnected) { if (p.id) p.reconnect(); else connect(); } }, 3000);
}

function joinAsGuest(hostId, opts) {
  role = 'guest';
  const p = peer = new Peer(opts);
  p.on('open', () => {
    setStatus(`Room ${roomCode} · joining…`, 'wait');
    const c = p.connect(hostId, {serialization: 'json'});
    attachData(c);
    c.on('open', () => { mc = p.call(hostId, localStream); attachCall(mc); });
    clearTimeout(guestTimer);
    guestTimer = setTimeout(() => {
      if (!c.open) setStatus('Can’t reach them directly. Add a TURN key (top of file).', '');
    }, 15000);
  });
  p.on('error', err => {
    if (err.type === 'peer-unavailable') { setStatus(`Room ${roomCode} · retrying…`, 'wait'); setTimeout(() => { if (peer === p) connect(); }, 1500); }
    else netError(err);
  });
  p.on('disconnected', () => softReconnect(p));
}

function netError(err) {
  console.warn(err.type, err);
  if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type) && !(dc && dc.open))
    setStatus('Can’t reach the matchmaking server, retrying…', 'wait');
}

function attachData(c) {
  dc = c;
  c.on('open', () => {
    clearTimeout(guestTimer);
    setStatus(`Room ${roomCode} · together`, 'on');
    $('near').style.display = 'flex';
    c.send({t: 'hi', host: role === 'host'});
    them.visible = true;
  });
  c.on('data', onData);
  c.on('close', () => {
    if (dc !== c) return;
    dc = null; them.visible = false; teardownRemoteAudio();
    if (mc) { mc.close(); mc = null; }
    $('near').style.display = 'none';
    toast('They left the room');
    if (role === 'guest') connect(); else setStatus(`Room ${roomCode} · waiting for them`, 'wait');
  });
}

function attachCall(call) {
  call.on('stream', s => setupRemoteAudio(s));
  call.on('close', teardownRemoteAudio);
}

function onData(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 's') { themTarget.x = +m.x || 0; themTarget.z = +m.z || 0; themTarget.r = +m.r || 0; themTarget.mv = !!m.m; }
  else if (m.t === 'full') { setStatus('That room already has two people', ''); }
}

/* ================= SCENE ================= */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1b1622');
scene.fog = new THREE.Fog('#2a2233', 24, 48);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);

const RW = 28, RD = 20, WH = 3.4; // room width (x), depth (z), wall height
const boxes = []; // colliders {x,z,hw,hd}
const mat = c => new THREE.MeshStandardMaterial({color: c, roughness: .85});
function box(w, h, d, color, x, y, z, collide) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof color === 'string' ? mat(color) : color);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  if (collide) boxes.push({x, z, hw: w / 2, hd: d / 2});
  return m;
}
function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

// floor: warm planks
const planks = canvasTex(512, 512, (g, w, h) => {
  for (let i = 0; i < 8; i++) for (let j = -1; j < 2; j++) {
    const y = j * 256 + (i % 2) * 128, l = 44 + Math.random() * 12;
    g.fillStyle = `hsl(28,42%,${l}%)`; g.fillRect(i * 64, y, 64, 256);
    g.fillStyle = 'rgba(40,20,10,.35)'; g.fillRect(i * 64, y, 64, 2);
  }
  g.fillStyle = 'rgba(40,20,10,.35)'; for (let i = 0; i < 8; i++) g.fillRect(i * 64, 0, 2, h);
});
planks.wrapS = planks.wrapT = THREE.RepeatWrapping; planks.repeat.set(RW / 4, RD / 4);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), new THREE.MeshStandardMaterial({map: planks, roughness: .7}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// walls + baseboards
const wallM = mat('#5b4060');
box(RW, WH, .3, wallM, 0, WH / 2, -RD / 2 - .15); box(RW, WH, .3, wallM, 0, WH / 2, RD / 2 + .15);
box(.3, WH, RD, wallM, -RW / 2 - .15, WH / 2, 0); box(.3, WH, RD, wallM, RW / 2 + .15, WH / 2, 0);
const baseM = mat('#3b2a40');
box(RW, .18, .06, baseM, 0, .09, -RD / 2 + .03); box(RW, .18, .06, baseM, 0, .09, RD / 2 - .03);
box(.06, .18, RD, baseM, -RW / 2 + .03, .09, 0); box(.06, .18, RD, baseM, RW / 2 - .03, .09, 0);

// night windows on the back wall
const sky = canvasTex(256, 384, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0d1030'); gr.addColorStop(1, '#3c2a5c');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(255,255,255,${.3 + Math.random() * .7})`; const s = Math.random() < .1 ? 2.5 : 1.2; g.fillRect(Math.random() * w, Math.random() * h * .8, s, s); }
});
for (const x of [-8, 0, 8]) {
  box(2.6, 2, .12, '#2b1f2e', x, 1.9, -RD / 2 + .02);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 1.75), new THREE.MeshBasicMaterial({map: sky}));
  win.position.set(x, 1.9, -RD / 2 + .1); scene.add(win);
  box(2.3, .06, .1, '#2b1f2e', x, 1.9, -RD / 2 + .13); box(.06, 1.75, .1, '#2b1f2e', x, 1.9, -RD / 2 + .13);
}

// rug
const rug = new THREE.Mesh(new THREE.CircleGeometry(3.4, 48), new THREE.MeshStandardMaterial({
  map: canvasTex(256, 256, (g) => { for (let r = 128; r > 0; r -= 16) { g.fillStyle = (r / 16) % 2 ? '#c9604a' : '#e9a86b'; g.beginPath(); g.arc(128, 128, r, 0, 7); g.fill(); } }),
  roughness: 1}));
rug.rotation.x = -Math.PI / 2; rug.position.set(-4, .01, 1); rug.receiveShadow = true; scene.add(rug);

// couch facing the rug
const couchM = mat('#3e7d74');
box(4.2, .55, 1.2, couchM, -4, .3, -3, true); box(4.2, .8, .35, couchM, -4, .85, -3.45);
box(.35, .75, 1.2, couchM, -6.1, .5, -3); box(.35, .75, 1.2, couchM, -1.9, .5, -3);
// round table
const table = new THREE.Mesh(new THREE.CylinderGeometry(.8, .8, .08, 32), mat('#8a5a3c'));
table.position.set(-4, .55, 1); table.castShadow = true; scene.add(table);
box(.12, .55, .12, '#6b4430', -4, .27, 1); boxes.push({x: -4, z: 1, hw: .75, hd: .75});
// bookshelf on the right wall
box(.5, 2.4, 4, '#6b4430', RW / 2 - .3, 1.2, -4, true);
const bookCols = ['#ff7a59', '#4fd1b5', '#ffcf8a', '#9b7ede', '#e9e2d0', '#c9604a'];
for (let s = 0; s < 4; s++) for (let b = 0; b < 12; b++) {
  const h = .3 + Math.random() * .18;
  box(.32, h, .22, bookCols[(s * 5 + b) % 6], RW / 2 - .5, .15 + s * .58 + h / 2, -5.7 + b * .3);
}
// bench under the windows on the far right
box(3.4, .45, .8, '#8a5a3c', 8, .23, -RD / 2 + .7, true);
// plants
function plant(x, z, s = 1) {
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(.32 * s, .25 * s, .5 * s, 16), mat('#c9604a'));
  pot.position.set(x, .25 * s, z); pot.castShadow = true; scene.add(pot);
  for (let i = 0; i < 3; i++) {
    const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry((.45 - i * .08) * s, 0), mat(['#4f8f5a', '#3f7a4c', '#6aa86a'][i]));
    leaf.position.set(x + (Math.random() - .5) * .2, (.75 + i * .4) * s, z + (Math.random() - .5) * .2); leaf.castShadow = true; scene.add(leaf);
  }
  boxes.push({x, z, hw: .35 * s, hd: .35 * s});
}
plant(-RW / 2 + .8, -RD / 2 + .8, 1.3); plant(RW / 2 - .8, RD / 2 - .8, 1.2); plant(4, -RD / 2 + .8); plant(-RW / 2 + .8, RD / 2 - .8);
// lamps (warm point lights)
function lamp(x, z) {
  box(.08, 1.7, .08, '#2b1f2e', x, .85, z);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(.45, .5, 24, 1, true), new THREE.MeshStandardMaterial({color: '#ffcf8a', emissive: '#ffb45c', emissiveIntensity: 1.4, side: THREE.DoubleSide}));
  shade.position.set(x, 1.85, z); scene.add(shade);
  const L = new THREE.PointLight('#ffc27a', 14, 13, 1.6); L.position.set(x, 1.7, z); scene.add(L);
  boxes.push({x, z, hw: .3, hd: .3});
}
lamp(-7, -3.2); lamp(9, 5); lamp(1, -8.5);

scene.add(new THREE.HemisphereLight('#b9a3d6', '#4a3020', .9));
const moon = new THREE.DirectionalLight('#cdd6ff', .9);
moon.position.set(-6, 12, -10); moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
Object.assign(moon.shadow.camera, {left: -16, right: 16, top: 12, bottom: -12, near: 1, far: 40});
scene.add(moon);

// characters
function makeBlob(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.42, .7, 8, 20), new THREE.MeshStandardMaterial({color, roughness: .55}));
  body.position.y = .82; body.castShadow = true; g.add(body);
  const eyeM = new THREE.MeshStandardMaterial({color: '#1b1622', roughness: .3});
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.07, 12, 12), eyeM); e.scale.set(1, 1.3, .6); e.position.set(s * .15, 1.12, .38); g.add(e); }
  const halo = new THREE.Mesh(new THREE.TorusGeometry(.55, .035, 8, 40), new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0}));
  halo.rotation.x = Math.PI / 2; halo.position.y = .05; g.add(halo);
  g.userData = {body, halo};
  scene.add(g); return g;
}
const COLS = {host: '#ff7a59', guest: '#4fd1b5'};
let me, them;
const myPos = {x: 0, z: 4, r: Math.PI};
const themTarget = {x: 0, z: 4, r: Math.PI, mv: false};
const themPos = {x: 0, z: 4, r: Math.PI};

/* ================= INPUT ================= */
const keys = {};
addEventListener('keydown', e => { if (e.target === codeIn) return; keys[e.code] = true; });
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
let yaw = 0, pitch = .38;
const stick = {id: null, ox: 0, oy: 0, x: 0, y: 0}, look = {id: null, lx: 0, ly: 0};
const stickEl = $('stick'), knob = $('knob');
canvas.addEventListener('pointerdown', e => {
  if (actx && actx.state !== 'running') actx.resume();
  canvas.setPointerCapture(e.pointerId);
  if (e.pointerType === 'touch' && e.clientX < innerWidth * .45 && stick.id === null) {
    Object.assign(stick, {id: e.pointerId, ox: e.clientX, oy: e.clientY, x: 0, y: 0});
    stickEl.style.display = 'block'; stickEl.style.left = e.clientX + 'px'; stickEl.style.top = e.clientY + 'px';
    knob.style.transform = '';
  } else if (look.id === null) Object.assign(look, {id: e.pointerId, lx: e.clientX, ly: e.clientY});
  hideHelp();
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === stick.id) {
    let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy; const m = Math.hypot(dx, dy), R = 50;
    if (m > R) { dx *= R / m; dy *= R / m; }
    stick.x = dx / R; stick.y = dy / R; knob.style.transform = `translate(${dx}px,${dy}px)`;
  } else if (e.pointerId === look.id) {
    yaw -= (e.clientX - look.lx) * .006; pitch = Math.min(1.1, Math.max(.12, pitch + (e.clientY - look.ly) * .004));
    look.lx = e.clientX; look.ly = e.clientY;
  }
});
function endPtr(e) {
  if (e.pointerId === stick.id) { stick.id = null; stick.x = stick.y = 0; stickEl.style.display = 'none'; }
  if (e.pointerId === look.id) look.id = null;
}
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
let helpHidden = false;
function hideHelp() { if (helpHidden) return; helpHidden = true; setTimeout(() => $('help').style.opacity = 0, 2500); }
if (matchMedia('(pointer:coarse)').matches) $('help').textContent = 'Left thumb to walk · drag right side to look';

/* ================= COLLISION ================= */
const R = .45;
function collide(p, other) {
  p.x = Math.min(RW / 2 - R, Math.max(-RW / 2 + R, p.x));
  p.z = Math.min(RD / 2 - R, Math.max(-RD / 2 + R, p.z));
  for (const b of boxes) {
    const cx = Math.max(b.x - b.hw, Math.min(p.x, b.x + b.hw)), cz = Math.max(b.z - b.hd, Math.min(p.z, b.z + b.hd));
    const dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz);
    if (d < R) {
      if (d > 1e-4) { p.x = cx + dx / d * R; p.z = cz + dz / d * R; }
      else { // centre inside the box: push out along the shallowest side
        const ox = b.hw - Math.abs(p.x - b.x), oz = b.hd - Math.abs(p.z - b.z);
        if (ox < oz) p.x = b.x + Math.sign(p.x - b.x || 1) * (b.hw + R); else p.z = b.z + Math.sign(p.z - b.z || 1) * (b.hd + R);
      }
    }
  }
  if (other) {
    const dx = p.x - other.x, dz = p.z - other.z, d = Math.hypot(dx, dz);
    if (d < R * 2 && d > 1e-4) { p.x = other.x + dx / d * R * 2; p.z = other.z + dz / d * R * 2; }
  }
}

/* ================= LOOP ================= */
let last = performance.now(), sendAcc = 0, walkT = 0, themWalkT = 0;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 72 : 60; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const angLerp = (a, b, k) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a)) * k;

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  // input -> movement relative to camera
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + stick.x;
  let iy = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - stick.y;
  if (keys.KeyQ) yaw += dt * 2; if (keys.KeyE) yaw -= dt * 2;
  const im = Math.hypot(ix, iy); if (im > 1) { ix /= im; iy /= im; }
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const mx = fx * iy + rx * ix, mz = fz * iy + rz * ix;
  const moving = im > .08, speed = keys.ShiftLeft ? 6 : 3.6;
  if (moving) {
    myPos.x += mx * speed * dt; myPos.z += mz * speed * dt;
    myPos.r = angLerp(myPos.r, Math.atan2(mx, mz), 1 - Math.exp(-dt * 12));
    walkT += dt * 9;
  }
  collide(myPos, them.visible ? themPos : null);
  me.position.set(myPos.x, Math.abs(Math.sin(walkT)) * (moving ? .12 : 0), myPos.z); me.rotation.y = myPos.r;
  me.userData.body.scale.set(1, moving ? 1 - Math.abs(Math.sin(walkT)) * .05 : 1, 1);

  // remote smoothing
  const k = 1 - Math.exp(-dt * 12);
  themPos.x += (themTarget.x - themPos.x) * k; themPos.z += (themTarget.z - themPos.z) * k;
  themPos.r = angLerp(themPos.r, themTarget.r, k);
  if (themTarget.mv) themWalkT += dt * 9;
  them.position.set(themPos.x, themTarget.mv ? Math.abs(Math.sin(themWalkT)) * .12 : 0, themPos.z); them.rotation.y = themPos.r;

  // speaking halos
  const myLvl = micMuted ? 0 : level(localAnalyser), thLvl = level(remote.analyser);
  for (const [g, l] of [[me, myLvl], [them, thLvl]]) {
    const h = g.userData.halo; h.material.opacity += (Math.min(.9, l * 1.4) - h.material.opacity) * .35;
    const s = 1 + l * .5; h.scale.set(s, s, s);
  }
  $('mic').querySelector('.ring').style.opacity = Math.min(1, myLvl * 1.6);

  // camera: third person, kept inside the room
  const dist = 6.2, cy = myPos.x, cz = myPos.z;
  let camX = cy + Math.sin(yaw) * Math.cos(pitch) * dist, camZ = cz + Math.cos(yaw) * Math.cos(pitch) * dist;
  camX = Math.min(RW / 2 - .3, Math.max(-RW / 2 + .3, camX)); camZ = Math.min(RD / 2 - .3, Math.max(-RD / 2 + .3, camZ));
  camera.position.set(camX, Math.min(WH - .2, 1.1 + Math.sin(pitch) * dist), camZ);
  camera.lookAt(myPos.x, 1.1, myPos.z);

  // positional voice
  if (them.visible) {
    const g = updateAudio(myPos, themPos, yaw);
    const d = Math.hypot(themPos.x - myPos.x, themPos.z - myPos.z);
    $('dist').textContent = d < 1.6 ? 'right here' : `${d.toFixed(1)} m` + (g < .01 ? ' · out of earshot' : '');
    $('vol').firstChild.style.width = (g * 100).toFixed(0) + '%';
  } else updateAudio(myPos, myPos, yaw);

  // send my state ~15 times a second
  sendAcc += dt;
  if (sendAcc > 1 / 15 && dc && dc.open) {
    sendAcc = 0;
    dc.send({t: 's', x: +myPos.x.toFixed(3), z: +myPos.z.toFixed(3), r: +myPos.r.toFixed(3), m: moving});
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ================= START ================= */
goBtn.addEventListener('click', async () => {
  roomCode = codeIn.value.trim().toUpperCase();
  if (roomCode.length < 3) { codeIn.focus(); return; }
  goBtn.disabled = true; goBtn.textContent = '…';
  // audio context must be created inside the tap (iOS)
  actx = new (window.AudioContext || window.webkitAudioContext)();
  actx.resume();
  master = actx.createGain(); master.connect(actx.destination);
  try {
    localStream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}, video: false});
  } catch (e) {
    micDenied = true; localStream = actx.createMediaStreamDestination().stream; // silent stream so they can still talk to you
  }
  setupLocalMeter();
  history.replaceState(null, '', '#' + roomCode);
  iceServers = await getIceServers();
  $('lobby').style.display = 'none'; $('hud').style.display = 'block';
  if (micDenied) { toast('No mic access, you can listen only'); $('mic').classList.add('off'); $('slash').style.display = ''; }
  setStatus('Connecting…', 'wait');
  connect();
  // colour + spawn depend on role, which settles within a second
  me.visible = true;
  myPos.x = (Math.random() - .5) * 6; myPos.z = 5;
  requestAnimationFrame(t => { last = t; frame(t); });
  const fixColours = setInterval(() => {
    if (!peer || !peer.open) return;
    clearInterval(fixColours);
    myPos.x = role === 'host' ? -2 : 2;
    me.userData.body.material.color.set(COLS[role]); me.userData.halo.material.color.set(COLS[role]);
    const o = role === 'host' ? 'guest' : 'host';
    them.userData.body.material.color.set(COLS[o]); them.userData.halo.material.color.set(COLS[o]);
  }, 200);
});

$('mic').addEventListener('click', () => {
  if (micDenied) { toast('The browser blocked the mic for this page'); return; }
  micMuted = !micMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
  $('mic').classList.toggle('off', micMuted); $('slash').style.display = micMuted ? '' : 'none';
  toast(micMuted ? 'Mic muted' : 'Mic on');
});
$('link').addEventListener('click', async () => {
  const url = location.href.split('#')[0] + '#' + roomCode;
  try { await navigator.clipboard.writeText(url); toast('Invite link copied'); }
  catch (e) { toast(url); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && actx && actx.state !== 'running') actx.resume(); });

// render the empty room behind the lobby so it isn't just a flat page
me = makeBlob(COLS.host); them = makeBlob(COLS.guest); me.visible = false; them.visible = false;
camera.position.set(0, 6, 13); camera.lookAt(0, 1, 0);
renderer.render(scene, camera);
</script>
</body>
